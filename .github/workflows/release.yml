name: Release

# Push a version tag and this builds installers for all three platforms and
# publishes them to a GitHub Release:
#
#   npm version patch      (or minor / major — this also creates the tag)
#   git push --follow-tags
#
# `workflow_dispatch` re-runs it by hand if a build needs redoing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and publish'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      - run: npm run typecheck
      - run: npm test

  build:
    name: Build ${{ matrix.label }}
    needs: verify
    runs-on: ${{ matrix.os }}

    # Both downloaders honour these, so every Electron binary the run needs
    # lands in one pair of directories the cache step below can carry over.
    # Under the workspace because a job-level env block can only read the
    # `github` context — `runner.temp` is a step-level value and fails to parse
    # here. The `files` allow-list in package.json keeps .cache out of the app.
    env:
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder

    strategy:
      fail-fast: false
      matrix:
        include:
          # The .yml files are the update feed electron-updater reads, and the
          # blockmaps let it download only the changed parts. Without them the
          # installers publish fine but auto-update never sees a new version.
          - os: windows-latest
            label: Windows
            command: npm run package:win
            artifacts: |
              release/*.exe
              release/*.exe.blockmap
              release/latest.yml
          - os: macos-latest
            label: macOS
            command: npm run package:mac
            artifacts: |
              release/*.dmg
              release/*.dmg.blockmap
              release/latest-mac.yml
          - os: ubuntu-latest
            label: Linux
            command: npm run package:linux
            artifacts: |
              release/*.AppImage
              release/latest-linux.yml

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Fetching Electron itself is the least reliable part of a release: v0.3.6
      # failed with "An existing connection was forcibly closed by the remote
      # host" partway through the 121 MB win32-x64 zip, and took the whole
      # release down with it. A warm cache means most runs never make the
      # request; the retries below cover the runs that still have to.
      - name: Cache Electron binaries
        uses: actions/cache@v4
        with:
          path: .cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-${{ runner.os }}-

      # npm ci runs Electron's postinstall download, so it can fail the same way.
      - name: Install dependencies
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if npm ci; then exit 0; fi
            echo "::warning::npm ci failed (attempt $attempt of 3)."
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 20)); fi
          done
          echo "::error::npm ci failed three times — see the log above."
          exit 1

      # The signing variables must be *absent* when there is no certificate, not
      # present-but-empty: electron-builder treats an empty CSC_LINK as a path
      # and fails on macOS with "<workspace> not a file". So they are exported
      # here only when the secrets actually hold something.
      - name: Configure signing
        shell: bash
        env:
          IN_CSC_LINK: ${{ secrets.CSC_LINK }}
          IN_CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          IN_APPLE_ID: ${{ secrets.APPLE_ID }}
          IN_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          IN_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$IN_CSC_LINK" ]; then
            {
              echo "CSC_LINK=$IN_CSC_LINK"
              echo "CSC_KEY_PASSWORD=$IN_CSC_KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "Code-signing certificate configured."
          else
            # Also stops macOS searching the keychain for an identity.
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
            echo "::warning::Unsigned build. Windows shows SmartScreen ('Unknown publisher') and macOS Gatekeeper blocks first launch. Add the CSC_LINK and CSC_KEY_PASSWORD secrets to sign."
          fi

          if [ -n "$IN_APPLE_ID" ]; then
            {
              echo "APPLE_ID=$IN_APPLE_ID"
              echo "APPLE_APP_SPECIFIC_PASSWORD=$IN_APPLE_APP_SPECIFIC_PASSWORD"
              echo "APPLE_TEAM_ID=$IN_APPLE_TEAM_ID"
            } >> "$GITHUB_ENV"
            echo "Apple notarisation configured."
          fi

      # --publish never, and no GH_TOKEN: otherwise electron-builder uploads its
      # own copy of every artifact on a tag, and the release ends up with each
      # installer listed twice alongside blockmaps and latest*.yml.
      #
      # Retried because the Electron download happens inside this step: a dropped
      # connection is worth another attempt, and recompiling the app beforehand
      # costs about a second. A genuine packaging fault fails all three times.
      - name: Build installer
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if ${{ matrix.command }} -- --publish never; then exit 0; fi
            echo "::warning::Packaging failed (attempt $attempt of 3)."
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 30)); fi
          done
          echo "::error::Packaging failed three times — see the log above."
          exit 1

      # v0.3.1 shipped installers that could not start: the `files` glob had
      # been narrowed and silently dropped dist/shared, which main.js requires
      # before any logging exists. Typecheck and tests both passed, because the
      # fault was in the packaging rather than the code. This reads the built
      # asar and refuses to publish anything with a missing require.
      - name: Verify the package can start
        run: npm run verify:package

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.label }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Collect installers
        uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      - name: List what will be published
        run: ls -lh installers

      - name: Write release notes
        id: notes
        run: |
          VERSION="${{ github.event.inputs.tag || github.ref_name }}"
          {
            echo "## Campus Connect ${VERSION}"
            echo
            echo "Copy on one machine, paste on another. Encrypted, room-based, and entirely on your own network."
            echo
            echo "### Download"
            echo
            echo "| Platform | File |"
            echo "|----------|------|"
            for f in installers/*.exe;      do [ -e "$f" ] && echo "| Windows 10/11 | \`$(basename "$f")\` |"; done
            for f in installers/*.dmg;      do [ -e "$f" ] && echo "| macOS | \`$(basename "$f")\` |"; done
            for f in installers/*.AppImage; do [ -e "$f" ] && echo "| Ubuntu / Linux | \`$(basename "$f")\` |"; done
            echo
            echo "Install it on **both** machines you want to sync, then create a room on one and join it from the other."
            echo
            echo "> The installers are not code-signed, so Windows SmartScreen shows a warning — choose **More info → Run anyway**. On macOS, right-click the app and choose **Open** the first time. On Ubuntu, \`chmod +x\` the AppImage before running it."
            echo
            echo "### What changed"
          } > notes.md

          # Everything since the previous tag, minus the noise.
          PREVIOUS=$(git describe --tags --abbrev=0 "${VERSION}^" 2>/dev/null || true)
          if [ -n "$PREVIOUS" ]; then
            echo >> notes.md
            git log --no-merges --pretty='- %s' "${PREVIOUS}..${VERSION}" >> notes.md
            echo >> notes.md
            echo "**Full changelog:** https://github.com/${{ github.repository }}/compare/${PREVIOUS}...${VERSION}" >> notes.md
          else
            echo >> notes.md
            echo "First public release." >> notes.md
          fi

          {
            echo
            echo "---"
            echo
            echo "Built by [Vijaya Pardhu](https://github.com/Vijayapardhu) · [Documentation](https://vijayapardhu.github.io/Clipboard/) · MIT licensed"
          } >> notes.md

          cat notes.md

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Campus Connect ${{ github.event.inputs.tag || github.ref_name }}
          body_path: notes.md
          files: installers/*
          draft: false
          # A tag with a suffix (v1.0.0-beta.1) publishes as a prerelease.
          prerelease: ${{ contains(github.event.inputs.tag || github.ref_name, '-') }}
