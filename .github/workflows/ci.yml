name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same branch cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, build & test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Electron's binary is only needed to run the app, not to typecheck or
      # build it, and skipping the ~100 MB download keeps CI fast.
      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  package:
    name: Packaging smoke test
    # Catches electron-builder config breakage without paying for all three
    # platforms on every push — the release workflow builds the real installers.
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest

    # Same reason as the release workflow: keep the Electron binaries in one
    # cacheable place so a flaky download does not fail the run.
    env:
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Cache Electron binaries
        uses: actions/cache@v4
        with:
          path: .cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-${{ runner.os }}-

      - run: npm ci

      - name: Build a Linux installer
        run: |
          for attempt in 1 2 3; do
            if npm run package:linux -- --publish never; then exit 0; fi
            echo "::warning::Packaging failed (attempt $attempt of 3)."
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 30)); fi
          done
          echo "::error::Packaging failed three times — see the log above."
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: appimage-dev-build
          path: release/*.AppImage
          if-no-files-found: error
          retention-days: 7
